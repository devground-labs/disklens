[package]
name = "disklens"
version = "0.2.0"
edition = "2024"
authors = ["devground-labs"]
description = "See what's filling your Mac's disk and what's safe to reclaim."
repository = "https://github.com/devground-labs/disklens"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
dirs = "7.0.0"
dispatch2 = "0.3.1"
eframe = "0.37.0"
egui_extras = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
